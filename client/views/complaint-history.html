<body>

  <nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-screwdriver-wrench"></i> MaintainEase</div>
    <ul class="nav-links">
      <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="/views/complaint-form.html"><i class="fa-solid fa-pen-to-square"></i> Report Issue</a></li>
      <li><a href="/views/complaint-history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> My Complaints</a></li>
      <li><a href="/views/admin-dashboard.html"><i class="fa-solid fa-gauge-high"></i> Admin</a></li>

    <h1><i class="fa-solid fa-clock-rotate-left" style="color:var(--blue);margin-right:10px;"></i>My Complaint History</h1>
    <p>Enter your apartment number to view all your submitted maintenance complaints.</p>

    <div class="search-card">
      <h2><i class="fa-solid fa-magnifying-glass" style="color:var(--blue)"></i> Search by Apartment Number</h2>
      <div class="search-box">
        <input type="text" id="apartment-input" placeholder="Enter apartment number (e.g. B-204)"/>
        <button class="btn btn-primary" id="search-btn"><i class="fa-solid fa-search"></i> Search</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="complaints-list"></div>
  </div>

  <footer class="footer">
    <span class="footer-brand"><i class="fa-solid fa-screwdriver-wrench"></i> MaintainEase</span>
